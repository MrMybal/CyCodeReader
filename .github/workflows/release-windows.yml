name: Windows release packages
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from package_windows import version; print(version())"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Release tag must match the CMake project version.'
          }
          $release = Get-Content packaging/release.json -Raw | ConvertFrom-Json
          if ($release.prerelease -isnot [bool]) { throw 'prerelease must be a boolean.' }
          if (-not (Test-Path "Docs/Releases/v$version.md" -PathType Leaf)) {
            throw 'Versioned release notes are required.'
          }
      - name: Fetch pinned public dependencies
        run: python scripts/fetch_dependencies.py
        # The locked CyUI revision must be accessible to this runner. No private
        # read token or developer credential is requested or persisted here.
      - name: Build production application and bundled help
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $arguments = @('scripts/build.py')
          if ($env:REPOSITORY_PRIVATE -eq 'false') { $arguments += '--public-updates' }
          python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Locate or install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { choco install innosetup --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Package installer and portable edition
        run: python scripts/package_windows.py
      - name: Preserve reviewable packages
        uses: actions/upload-artifact@v4
        with:
          name: CyCodeReader-windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    # Preparation on a private repository only creates workflow artifacts.
    # Public tagged builds become GitHub Releases; manual runs never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CyCodeReader-windows-x64
          path: dist
      - name: Publish complete public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a numeric release tag.')
          profile = json.loads(Path('packaging/release.json').read_text('utf-8'))
          if type(profile.get('prerelease')) is not bool:
              raise SystemExit('prerelease must be a boolean.')
          # A reviewed local publication can race the tag-triggered builder.
          # Keep published files immutable; only skip a complete matching tag.
          endpoint = f"repos/{os.environ['GH_REPO']}/releases/tags/{tag}"
          probe = subprocess.run(['gh', 'api', endpoint], text=True, capture_output=True)
          if probe.returncode == 0:
              existing = json.loads(probe.stdout)
              required = {p.name for p in Path('dist').iterdir()}
              assets = existing.get('assets', [])
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              source = json.loads(subprocess.check_output(
                  ['gh', 'api', f"repos/{os.environ['GH_REPO']}/commits/{tag}"], text=True))
              if (existing['draft'] or existing['prerelease'] != profile['prerelease']
                  or {a['name'] for a in assets} != required or source['sha'] != head
                  or any(a['size'] <= 0 or not re.fullmatch(r'sha256:[0-9a-f]{64}', a.get('digest') or '') for a in assets)):
                  raise SystemExit('Existing release needs review; no published files changed.')
              print('This source tag is already published with complete assets; keeping the published files.')
              raise SystemExit(0)
          if 'HTTP 404' not in probe.stderr:
              raise SystemExit('Cannot inspect existing release; no publication attempted.')
          command = ['gh', 'release', 'create', tag,
                     *map(str, sorted(Path('dist').iterdir())), '--verify-tag',
                     '--notes-file', f'Docs/Releases/{tag}.md',
                     '--title', f'CyCodeReader {tag}' + (' — bêta' if profile['prerelease'] else '')]
          if profile['prerelease']:
              command.append('--prerelease')
          subprocess.run(command, check=True)
          PY
