name: Website and documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the showcase and complete pinned CyDoc reader
        run: python website/build.py
      - name: Verify translated routes, assets and offline reader
        run: |
          python scripts/verify_sources.py
          python scripts/verify_documentation.py Documentation
          python website/verify.py dist/website
      - name: Verify script syntax and reader interactions without native applications
        run: |
          node --check website/site.js
          node .CyDocBuild/verify_dom.mjs Documentation

      - uses: actions/checkout@v4
        with:
          ref: cycode-docs
          path: runtime/cycode-docs
          persist-credentials: false
      - name: Compose the showcase and both complete readers
        run: python website/compose_pages.py dist/website runtime/cycode-docs/site runtime/pages-upload
      - name: Verify the final shared Pages payload
        run: python website/verify.py runtime/pages-upload --with-cycode
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runtime/pages-upload
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase and complete readers
        id: deployment
        uses: actions/deploy-pages@v4
