name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the complete pinned CyDoc reader
        run: python scripts/build_documentation.py --output runtime/pages
      - name: Verify owned files, resources and translated routes
        run: python scripts/verify_documentation.py runtime/pages
      - name: Verify reader interactions without native applications
        run: node .CyDocBuild/verify_dom.mjs runtime/pages

      - uses: actions/checkout@v4
        with:
          ref: cycode-docs
          path: runtime/cycode-docs
          persist-credentials: false
      - name: Compose both complete readers without application data
        run: python scripts/compose_pages.py runtime/pages runtime/cycode-docs/site runtime/pages-upload
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runtime/pages-upload
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete reader
        id: deployment
        uses: actions/deploy-pages@v4
