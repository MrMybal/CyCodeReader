<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{description}}"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta name="theme-color" content="#12171a">
<title>{{title}}</title><link rel="icon" href="{{asset:logo.png}}"><link rel="stylesheet" href="{{asset:style.css}}"><script defer src="{{asset:site.js}}"></script></head><body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="header"><div class="container header-inner"><a class="brand" href="#main"><img src="{{asset:logo.png}}" width="30" height="30" alt=""><span>CyCodeReader</span></a>
<nav class="primary" id="primary-nav" data-i18n-aria="nav.label"><a href="#editor" data-i18n="nav.features"></a><a href="{{doc:overview}}" data-doc="overview" data-i18n="nav.docs"></a><a href="#download" data-i18n="nav.download"></a></nav>
<div class="header-actions"><a class="github button small" href="{{repository}}">GitHub <span aria-hidden="true">↗</span></a><select class="language" data-i18n-aria="nav.language"><option value="en">EN</option><option value="fr">FR</option></select><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" data-i18n-aria="nav.menu"><span aria-hidden="true">☰</span></button></div></div></header>
<main id="main"><section class="hero container" aria-labelledby="hero-title"><div class="hero-copy"><p class="status" data-i18n="hero.status"></p><h1 id="hero-title"><img src="{{asset:logo.png}}" width="54" height="54" alt="">CyCodeReader</h1><h2 data-i18n="hero.heading"></h2><p class="lead" data-i18n="hero.body"></p><div class="actions"><a class="button accent" href="#download" data-i18n="hero.download"></a><a class="button" href="{{doc:overview}}" data-doc="overview" data-i18n="hero.manual"></a></div><p class="quiet" data-i18n="hero.note"></p></div><figure class="capture" id="hero-capture"><button class="image-button" type="button" data-zoom="image.editor" data-i18n-aria="image.editor.zoom"><img src="{{asset:editor.png}}" width="1280" height="820" fetchpriority="high" data-i18n-alt="image.editor.alt" alt=""></button><figcaption data-i18n="image.editor.caption"></figcaption></figure></section><nav class="chapters" data-i18n-aria="nav.chapters"><div class="container chapter-inner"><a href="#editor" data-i18n="chapter.editor"></a><a href="#search" data-i18n="chapter.search"></a><a href="#compare" data-i18n="chapter.compare"></a><a href="#git" data-i18n="chapter.git"></a><a href="#syntax" data-i18n="chapter.syntax"></a><a href="#extensions" data-i18n="chapter.extensions"></a><a href="#manual" data-i18n="chapter.manual"></a><a href="#download" data-i18n="chapter.download"></a></div></nav><div class="container"><p class="capture-note" data-i18n="captures.note"></p></div><section id="editor" class="section container"><div class="section-intro"><p data-i18n="editor.eyebrow" class="eyebrow"></p><h2 data-i18n="editor.title" ></h2><p data-i18n="editor.body" class="intro-text"></p></div><div class="principles"><article><h3 data-i18n="editor.one.title" ></h3><p data-i18n="editor.one.body" ></p></article><article><h3 data-i18n="editor.two.title" ></h3><p data-i18n="editor.two.body" ></p></article><article><h3 data-i18n="editor.three.title" ></h3><p data-i18n="editor.three.body" ></p></article></div><a class="text-link" data-doc="editing" href="{{doc:editing}}"><span data-i18n="editor.guide"></span><span aria-hidden="true"> ↗</span></a></section><section class="band"><div id="search" class="section container split"><div><p data-i18n="search.eyebrow" class="eyebrow"></p><h2 data-i18n="search.title" ></h2><p data-i18n="search.body" ></p><ul class="checks"><li data-i18n="search.one" ></li><li data-i18n="search.two" ></li><li data-i18n="search.three" ></li></ul><div class="keys"><span><kbd>Ctrl+F</kbd><kbd>Ctrl+H</kbd></span><span><kbd>Ctrl+Shift+F</kbd></span></div><p data-i18n="search.limit" class="quiet"></p><a class="text-link" data-doc="search" href="{{doc:search}}"><span data-i18n="search.guide"></span><span aria-hidden="true"> ↗</span></a></div><div class="gallery" data-gallery><div class="tabs" role="tablist" data-i18n-aria="search.tabs"><button id="tab-find" type="button" role="tab" aria-selected="true" aria-controls="search-panel" data-gallery-file="find-replace.png" data-gallery-key="image.find" data-i18n="search.find"></button><button id="tab-documents" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="search-panel" data-gallery-file="search-documents.png" data-gallery-key="image.search" data-i18n="search.documents"></button></div><div id="search-panel" role="tabpanel" aria-labelledby="tab-find"><figure class="capture" ><button class="image-button" type="button" data-zoom="image.find" data-i18n-aria="image.find.zoom"><img src="{{asset:find-replace.png}}" width="1280" height="820" loading="lazy" data-i18n-alt="image.find.alt" alt=""></button><figcaption data-i18n="image.find.caption"></figcaption></figure></div></div></div></section><section id="compare" class="section container"><div class="wide-heading"><div><p data-i18n="compare.eyebrow" class="eyebrow"></p><h2 data-i18n="compare.title" ></h2></div><div><p data-i18n="compare.body" ></p><a class="text-link" data-doc="version-control" href="{{doc:version-control}}"><span data-i18n="compare.guide"></span><span aria-hidden="true"> ↗</span></a></div></div><figure class="capture" ><button class="image-button" type="button" data-zoom="image.compare" data-i18n-aria="image.compare.zoom"><img src="{{asset:compare.png}}" width="1280" height="820" loading="lazy" data-i18n-alt="image.compare.alt" alt=""></button><figcaption data-i18n="image.compare.caption"></figcaption></figure><p data-i18n="compare.note" class="quiet"></p></section><section class="band"><div id="git" class="section container split reverse"><figure class="capture" ><button class="image-button" type="button" data-zoom="image.git" data-i18n-aria="image.git.zoom"><img src="{{asset:git-history.png}}" width="1280" height="820" loading="lazy" data-i18n-alt="image.git.alt" alt=""></button><figcaption data-i18n="image.git.caption"></figcaption></figure><div><p data-i18n="git.eyebrow" class="eyebrow"></p><h2 data-i18n="git.title" ></h2><p data-i18n="git.body" ></p><p data-i18n="git.note" class="quiet"></p><a class="text-link" data-doc="version-control" href="{{doc:version-control}}"><span data-i18n="git.guide"></span><span aria-hidden="true"> ↗</span></a></div></div></section><section id="syntax" class="section container"><div class="wide-heading"><div><p data-i18n="syntax.eyebrow" class="eyebrow"></p><h2 data-i18n="syntax.title" ></h2></div><p data-i18n="syntax.body" ></p></div><div class="language-grid"><article><h3 data-i18n="syntax.native" ></h3><p data-i18n="syntax.native.body" ></p></article><article><h3 data-i18n="syntax.web" ></h3><p data-i18n="syntax.web.body" ></p></article><article><h3 data-i18n="syntax.special" ></h3><p data-i18n="syntax.special.body" ></p></article></div><p data-i18n="syntax.note" class="quiet"></p><a class="text-link" data-doc="languages" href="{{doc:languages}}"><span data-i18n="syntax.guide"></span><span aria-hidden="true"> ↗</span></a></section><section class="band"><div id="extensions" class="section container"><div class="section-intro"><p data-i18n="extensions.eyebrow" class="eyebrow"></p><h2 data-i18n="extensions.title" ></h2></div><div class="extension-grid"><article><h3 data-i18n="extensions.plugins.title" ></h3><p data-i18n="extensions.plugins.body" ></p><p data-i18n="extensions.plugins.note" class="quiet"></p><a class="text-link" data-doc="plugin-api" href="{{doc:plugin-api}}"><span data-i18n="extensions.plugins.link"></span><span aria-hidden="true"> ↗</span></a></article><article><h3 data-i18n="extensions.mcp.title" ></h3><p data-i18n="extensions.mcp.body" ></p><p data-i18n="extensions.mcp.note" class="quiet"></p><a class="text-link" data-doc="mcp" href="{{doc:mcp}}"><span data-i18n="extensions.mcp.link"></span><span aria-hidden="true"> ↗</span></a></article></div><figure class="schema" role="img" data-i18n-aria="schema.label"><div data-i18n="schema.editor"></div><span aria-hidden="true">↔</span><div class="core" data-i18n="schema.core"></div><span aria-hidden="true">↔</span><div data-i18n="schema.sdk"></div></figure></div></section><section id="manual" class="section container split"><div><p data-i18n="manual.eyebrow" class="eyebrow"></p><h2 data-i18n="manual.title" ></h2><p data-i18n="manual.body" ></p><p data-i18n="manual.note" class="quiet"></p><a class="text-link" data-doc="tour" href="{{doc:tour}}"><span data-i18n="manual.link"></span><span aria-hidden="true"> ↗</span></a></div><figure class="capture" ><button class="image-button" type="button" data-zoom="image.manual" data-i18n-aria="image.manual.zoom"><img src="{{asset:manual.jpg}}" width="1280" height="820" loading="lazy" data-i18n-alt="image.manual.alt" alt=""></button><figcaption data-i18n="image.manual.caption"></figcaption></figure></section><section class="section faq container"><h2 data-i18n="faq.title" ></h2><div><details><summary data-i18n="faq.one.q"></summary><p data-i18n="faq.one.a" ></p></details><details><summary data-i18n="faq.two.q"></summary><p data-i18n="faq.two.a" ></p></details><details><summary data-i18n="faq.three.q"></summary><p data-i18n="faq.three.a" ></p></details><details><summary data-i18n="faq.four.q"></summary><p data-i18n="faq.four.a" ></p></details></div></section><section class="download-band"><div id="download" class="section container download"><div><p data-i18n="download.eyebrow" class="eyebrow"></p><h2 data-i18n="download.title" ></h2><p data-i18n="download.body" ></p><div class="actions"><a class="button accent" href="{{portable}}" data-i18n="download.portable"></a><a class="button" href="{{setup}}" data-i18n="download.setup"></a></div><a class="text-link" href="{{releases}}" data-i18n="download.release"></a><p data-i18n="download.note" class="quiet"></p></div><aside><p data-i18n="download.platforms" ></p><p data-i18n="download.updates" class="quiet"></p><a class="text-link" data-doc="updates" href="{{doc:updates}}"><span data-i18n="nav.docs"></span><span aria-hidden="true"> ↗</span></a></aside></div></section></main>
<footer class="container footer"><div><a class="brand" href="#main"><img src="{{asset:logo.png}}" width="28" height="28" alt="">CyCodeReader</a><p data-i18n="footer.body" ></p><small>© 2026 Cyberalien</small></div><nav><a href="{{doc:overview}}" data-doc="overview" data-i18n="nav.docs"></a><a href="{{repository}}" data-i18n="footer.source"></a><a href="LICENSE.txt" data-i18n="footer.license"></a></nav></footer>
<dialog id="image-dialog" class="lightbox" aria-labelledby="image-caption"><div class="lightbox-header"><p id="image-caption"></p><button type="button" data-close data-i18n-aria="viewer.close">×</button></div><div class="lightbox-stage"><img alt=""></div><div class="lightbox-footer"><button type="button" data-previous data-i18n-aria="viewer.previous">←</button><span class="image-counter" aria-live="polite"></span><span class="viewer-hint" data-i18n="viewer.keys"></span><button type="button" data-next data-i18n-aria="viewer.next">→</button></div></dialog>
<script id="site-content" type="application/json">{{content}}</script><script id="site-config" type="application/json">{{config}}</script></body></html>
